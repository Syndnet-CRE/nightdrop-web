  - generic [ref=e1780]:
    - generic [ref=e1782]:
      - heading "Frequently Asked Questions" [level=2] [ref=e1783]
      - paragraph [ref=e1784]: Everything you need to know about Nightdrop before you get started
    - generic [ref=e1785]:
      - generic [ref=e1786]:
        - generic [ref=e1787]:
          - generic [ref=e1788]: How is this different from PropStream or BatchLeads?
          - img [ref=e1790]
        - generic [ref=e1794]: Those are list tools. You pull, scrub, and decide what to call. Nightdrop delivers finished deal briefs to your inbox every morning — already filtered for distress, already scored against your threshold, already written up. The work is done before you wake up.
      - generic [ref=e1795]:
        - generic [ref=e1796]:
          - generic [ref=e1797]: What if my market doesn't have enough data?
          - img [ref=e1799]
        - generic [ref=e1803]: We run a coverage check on every new buy box before activating. If your geography is too thin to produce quality matches, we'll tell you upfront — and you don't get charged. Coverage is full in 47 states; non-disclosure states (TX, KS, UT, and a few others) have lighter sale-price data but full ownership and distress data.
      - generic [ref=e1804]:
        - generic [ref=e1805]:
          - generic [ref=e1806]: Where does the data come from?
          - img [ref=e1808]
        - generic [ref=e1812]: ATTOM property data via Snowflake. 160 million parcels, approximately 900 data points per property, including geospatial, demographic, ownership, transaction, and assessment data.
      - generic [ref=e1813]:
        - generic [ref=e1814]:
          - generic [ref=e1815]: How fresh is the data?
          - img [ref=e1817]
        - generic [ref=e1821]: Our pipeline runs every 24 hours. Data provided by Parcyl.ai. Every morning's brief reflects the most current ownership, assessment, and distress data available.
      - generic [ref=e1822]:
        - generic [ref=e1823]:
          - generic [ref=e1824]: How does Nightdrop score a deal?
          - img [ref=e1826]
        - generic [ref=e1830]: Every property is scored against your buy box criteria and ranked by match confidence. Distress signals — tax delinquency, absentee ownership, vacancy indicators, lien history — are weighted against your threshold. Only properties that clear your bar make the digest.
      - generic [ref=e1831]:
        - generic [ref=e1832]:
          - generic [ref=e1833]: What if I get a deal that's not relevant?
          - img [ref=e1835]
        - generic [ref=e1839]: Hit Not Relevant. We log it and tighten future matches. Buy box criteria can also be edited any time before midnight to take effect on the next run.
      - generic [ref=e1840]:
        - generic [ref=e1841]:
          - generic [ref=e1842]: What asset classes do you cover?
          - img [ref=e1844]
        - generic [ref=e1848]: Residential (single-family, 2-4 unit, multifamily), commercial (industrial, retail, office), self-storage, land, and mixed-use. Buy box criteria are fully customizable.
      - generic [ref=e1849]:
        - generic [ref=e1850]:
          - generic [ref=e1851]: Can I cancel anytime?
          - img [ref=e1853]
        - generic [ref=e1857]: Yes. Cancel from your account in two clicks. You keep your nightly runs through the end of your billing period — no refunds, no pro-rating.
      - generic [ref=e1858]:
        - generic [ref=e1859]:
          - generic [ref=e1860]: Is there a contract?
          - img [ref=e1862]
        - generic [ref=e1866]: No. Month-to-month. Cancel anytime.
