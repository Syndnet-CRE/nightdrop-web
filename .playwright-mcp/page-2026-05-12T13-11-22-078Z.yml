    - generic [ref=e1784]:
      - heading "Frequently Asked Questions" [level=2] [ref=e1785]
      - paragraph [ref=e1786]: Everything you need to know about Nightdrop before you get started
    - generic [ref=e1787]:
      - generic [ref=e1788]:
        - generic [ref=e1789]:
          - generic [ref=e1790]: How is this different from PropStream or BatchLeads?
          - img [ref=e1792]
        - generic [ref=e1796]: Those are list tools. You pull, scrub, skip trace, and decide what to call. Nightdrop delivers finished deal briefs to your inbox every morning — already filtered for distress, already scored against your threshold, already skip traced, already written up. The work is done before you wake up.
      - generic [ref=e1797]:
        - generic [ref=e1798]:
          - generic [ref=e1799]: What if my market doesn't have enough data?
          - img [ref=e1801]
        - generic [ref=e1805]: We run a coverage check on every new buy box before activating. If your geography is too thin to produce quality matches, we'll tell you upfront — and you don't get charged. Coverage is full in 47 states; non-disclosure states (TX, KS, UT, and a few others) have lighter sale-price data but full ownership and distress data.
      - generic [ref=e1806]:
        - generic [ref=e1807]:
          - generic [ref=e1808]: Where does the data come from?
          - img [ref=e1810]
        - generic [ref=e1814]: ATTOM property data via Snowflake. 160 million parcels, approximately 900 data points per property, including geospatial, demographic, ownership, transaction, and assessment data.
      - generic [ref=e1815]:
        - generic [ref=e1816]:
          - generic [ref=e1817]: How fresh is the data?
          - img [ref=e1819]
        - generic [ref=e1823]: Our pipeline runs every 24 hours. Data provided by Parcyl.ai. Every morning's brief reflects the most current ownership, assessment, and distress data available.
      - generic [ref=e1824]:
        - generic [ref=e1825]:
          - generic [ref=e1826]: How accurate is the skip trace?
          - img [ref=e1828]
        - generic [ref=e1832]: Every contact comes with a confidence percentage. We surface phone and email pulled from public-records-grade skip trace data. Verify before outreach. We don't claim 100% — we claim transparent.
      - generic [ref=e1833]:
        - generic [ref=e1834]:
          - generic [ref=e1835]: What if I get a deal that's not relevant?
          - img [ref=e1837]
        - generic [ref=e1841]: Hit Not Relevant. We log it and tighten future matches. Buy box criteria can also be edited any time before midnight to take effect on the next run.
      - generic [ref=e1842]:
        - generic [ref=e1843]:
          - generic [ref=e1844]: What asset classes do you cover?
          - img [ref=e1846]
        - generic [ref=e1850]: Residential (single-family, 2-4 unit, multifamily), commercial (industrial, retail, office), self-storage, land, and mixed-use. Buy box criteria are fully customizable.
      - generic [ref=e1851]:
        - generic [ref=e1852]:
          - generic [ref=e1853]: Can I cancel anytime?
          - img [ref=e1855]
        - generic [ref=e1859]: Yes. Cancel from your account in two clicks. You keep your nightly runs through the end of your billing period — no refunds, no pro-rating.
      - generic [ref=e1860]:
        - generic [ref=e1861]:
          - generic [ref=e1862]: Is there a contract?
          - img [ref=e1864]
        - generic [ref=e1868]: No. Month-to-month. Cancel anytime.
