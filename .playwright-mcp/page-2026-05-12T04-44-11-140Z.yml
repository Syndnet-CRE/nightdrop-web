  - generic [ref=e1734]:
    - generic [ref=e1737]:
      - heading "Frequently Asked Questions" [level=2] [ref=e1738]
      - paragraph [ref=e1739]: Everything you need to know about Nightdrop before you get started
    - generic [ref=e1740]:
      - generic [ref=e1741] [cursor=pointer]:
        - generic [ref=e1742]:
          - generic [ref=e1743]: How is this different from PropStream or BatchLeads?
          - img [ref=e1745]
        - generic [ref=e1748]: Those are list tools. You pull, scrub, skip trace, and decide what to call. Nightdrop delivers finished deal briefs to your inbox every morning — already filtered for distress, already scored against your threshold, already skip traced, already written up. The work is done before you wake up.
      - generic [ref=e1749] [cursor=pointer]:
        - generic [ref=e1750]:
          - generic [ref=e1751]: What if my market doesn't have enough data?
          - img [ref=e1753]
        - generic [ref=e1756]: We run a coverage check on every new buy box before activating. If your geography is too thin to produce quality matches, we'll tell you upfront — and you don't get charged. Coverage is full in 47 states; non-disclosure states (TX, KS, UT, and a few others) have lighter sale-price data but full ownership and distress data.
      - generic [ref=e1757] [cursor=pointer]:
        - generic [ref=e1758]:
          - generic [ref=e1759]: Where does the data come from?
          - img [ref=e1761]
        - generic [ref=e1764]: ATTOM property data via Snowflake. 160 million parcels, approximately 900 data points per property, including geospatial, demographic, ownership, transaction, and assessment data.
      - generic [ref=e1765] [cursor=pointer]:
        - generic [ref=e1766]:
          - generic [ref=e1767]: How fresh is the data?
          - img [ref=e1769]
        - generic [ref=e1772]: Our pipeline runs every 24 hours. Data provided by Parcyl.ai. Every morning's brief reflects the most current ownership, assessment, and distress data available.
      - generic [ref=e1773] [cursor=pointer]:
        - generic [ref=e1774]:
          - generic [ref=e1775]: How accurate is the skip trace?
          - img [ref=e1777]
        - generic [ref=e1780]: Every contact comes with a confidence percentage. We surface phone and email pulled from public-records-grade skip trace data. Verify before outreach. We don't claim 100% — we claim transparent.
      - generic [ref=e1781] [cursor=pointer]:
        - generic [ref=e1782]:
          - generic [ref=e1783]: What if I get a deal that's not relevant?
          - img [ref=e1785]
        - generic [ref=e1788]: Hit Not Relevant. We log it and tighten future matches. Buy box criteria can also be edited any time before midnight to take effect on the next run.
      - generic [ref=e1789] [cursor=pointer]:
        - generic [ref=e1790]:
          - generic [ref=e1791]: What asset classes do you cover?
          - img [ref=e1793]
        - generic [ref=e1796]: Residential (single-family, 2-4 unit, multifamily), commercial (industrial, retail, office), self-storage, land, and mixed-use. Buy box criteria are fully customizable.
      - generic [ref=e1797] [cursor=pointer]:
        - generic [ref=e1798]:
          - generic [ref=e1799]: Can I cancel anytime?
          - img [ref=e1801]
        - generic [ref=e1804]: Yes. Cancel from your account in two clicks. You keep your nightly runs through the end of your billing period — no refunds, no pro-rating.
      - generic [ref=e1805] [cursor=pointer]:
        - generic [ref=e1806]:
          - generic [ref=e1807]: Is there a contract?
          - img [ref=e1809]
        - generic [ref=e1812]: No. Month-to-month. Cancel anytime.
