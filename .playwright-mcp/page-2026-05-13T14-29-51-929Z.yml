  - generic [ref=e1725]:
    - generic [ref=e1728]:
      - heading "Frequently Asked Questions" [level=2] [ref=e1729]
      - paragraph [ref=e1730]: Everything you need to know about Nightdrop before you get started
    - generic [ref=e1731]:
      - generic [ref=e1732] [cursor=pointer]:
        - generic [ref=e1733]:
          - generic [ref=e1734]: How is this different from PropStream or BatchLeads?
          - img [ref=e1736]
        - generic [ref=e1739]: Those are list tools. You pull, scrub, and decide what to call. Nightdrop delivers finished deal briefs to your inbox every morning — already filtered for distress, already scored against your threshold, already written up. The work is done before you wake up.
      - generic [ref=e1740] [cursor=pointer]:
        - generic [ref=e1741]:
          - generic [ref=e1742]: What if my market doesn't have enough data?
          - img [ref=e1744]
        - generic [ref=e1747]: We run a coverage check on every new buy box before activating. If your geography is too thin to produce quality matches, we'll tell you upfront — and you don't get charged. Coverage is full in 47 states; non-disclosure states (TX, KS, UT, and a few others) have lighter sale-price data but full ownership and distress data.
      - generic [ref=e1748] [cursor=pointer]:
        - generic [ref=e1749]:
          - generic [ref=e1750]: Where does the data come from?
          - img [ref=e1752]
        - generic [ref=e1755]: ATTOM property data via Snowflake. 160 million parcels, approximately 900 data points per property, including geospatial, demographic, ownership, transaction, and assessment data.
      - generic [ref=e1756] [cursor=pointer]:
        - generic [ref=e1757]:
          - generic [ref=e1758]: How fresh is the data?
          - img [ref=e1760]
        - generic [ref=e1763]: Our pipeline runs every 24 hours. Data provided by Parcyl.ai. Every morning's brief reflects the most current ownership, assessment, and distress data available.
      - generic [ref=e1764] [cursor=pointer]:
        - generic [ref=e1765]:
          - generic [ref=e1766]: How does Nightdrop score a deal?
          - img [ref=e1768]
        - generic [ref=e1771]: Every property is scored against your buy box criteria and ranked by match confidence. Distress signals — tax delinquency, absentee ownership, vacancy indicators, lien history — are weighted against your threshold. Only properties that clear your bar make the digest.
      - generic [ref=e1772] [cursor=pointer]:
        - generic [ref=e1773]:
          - generic [ref=e1774]: What if I get a deal that's not relevant?
          - img [ref=e1776]
        - generic [ref=e1779]: Hit Not Relevant. We log it and tighten future matches. Buy box criteria can also be edited any time before midnight to take effect on the next run.
      - generic [ref=e1780] [cursor=pointer]:
        - generic [ref=e1781]:
          - generic [ref=e1782]: What asset classes do you cover?
          - img [ref=e1784]
        - generic [ref=e1787]: Residential (single-family, 2-4 unit, multifamily), commercial (industrial, retail, office), self-storage, land, and mixed-use. Buy box criteria are fully customizable.
      - generic [ref=e1788] [cursor=pointer]:
        - generic [ref=e1789]:
          - generic [ref=e1790]: Can I cancel anytime?
          - img [ref=e1792]
        - generic [ref=e1795]: Yes. Cancel from your account in two clicks. You keep your nightly runs through the end of your billing period — no refunds, no pro-rating.
      - generic [ref=e1796] [cursor=pointer]:
        - generic [ref=e1797]:
          - generic [ref=e1798]: Is there a contract?
          - img [ref=e1800]
        - generic [ref=e1803]: No. Month-to-month. Cancel anytime.
