  - generic [ref=e1727]:
    - generic [ref=e1730]:
      - heading "Frequently Asked Questions" [level=2] [ref=e1731]
      - paragraph [ref=e1732]: Everything you need to know about Nightdrop before you get started
    - generic [ref=e1733]:
      - generic [ref=e1734] [cursor=pointer]:
        - generic [ref=e1735]:
          - generic [ref=e1736]: How is this different from PropStream or BatchLeads?
          - img [ref=e1738]
        - generic [ref=e1741]: Those are list tools. You pull, scrub, skip trace, and decide what to call. Nightdrop delivers finished deal briefs to your inbox every morning — already filtered for distress, already scored against your threshold, already skip traced, already written up. The work is done before you wake up.
      - generic [ref=e1742] [cursor=pointer]:
        - generic [ref=e1743]:
          - generic [ref=e1744]: What if my market doesn't have enough data?
          - img [ref=e1746]
        - generic [ref=e1749]: We run a coverage check on every new buy box before activating. If your geography is too thin to produce quality matches, we'll tell you upfront — and you don't get charged. Coverage is full in 47 states; non-disclosure states (TX, KS, UT, and a few others) have lighter sale-price data but full ownership and distress data.
      - generic [ref=e1750] [cursor=pointer]:
        - generic [ref=e1751]:
          - generic [ref=e1752]: Where does the data come from?
          - img [ref=e1754]
        - generic [ref=e1757]: ATTOM property data via Snowflake. 160 million parcels, approximately 900 data points per property, including geospatial, demographic, ownership, transaction, and assessment data.
      - generic [ref=e1758] [cursor=pointer]:
        - generic [ref=e1759]:
          - generic [ref=e1760]: How fresh is the data?
          - img [ref=e1762]
        - generic [ref=e1765]: Our pipeline runs every 24 hours. Data provided by Parcyl.ai. Every morning's brief reflects the most current ownership, assessment, and distress data available.
      - generic [ref=e1766] [cursor=pointer]:
        - generic [ref=e1767]:
          - generic [ref=e1768]: How accurate is the skip trace?
          - img [ref=e1770]
        - generic [ref=e1773]: Every contact comes with a confidence percentage. We surface phone and email pulled from public-records-grade skip trace data. Verify before outreach. We don't claim 100% — we claim transparent.
      - generic [ref=e1774] [cursor=pointer]:
        - generic [ref=e1775]:
          - generic [ref=e1776]: What if I get a deal that's not relevant?
          - img [ref=e1778]
        - generic [ref=e1781]: Hit Not Relevant. We log it and tighten future matches. Buy box criteria can also be edited any time before midnight to take effect on the next run.
      - generic [ref=e1782] [cursor=pointer]:
        - generic [ref=e1783]:
          - generic [ref=e1784]: What asset classes do you cover?
          - img [ref=e1786]
        - generic [ref=e1789]: Residential (single-family, 2-4 unit, multifamily), commercial (industrial, retail, office), self-storage, land, and mixed-use. Buy box criteria are fully customizable.
      - generic [ref=e1790] [cursor=pointer]:
        - generic [ref=e1791]:
          - generic [ref=e1792]: Can I cancel anytime?
          - img [ref=e1794]
        - generic [ref=e1797]: Yes. Cancel from your account in two clicks. You keep your nightly runs through the end of your billing period — no refunds, no pro-rating.
      - generic [ref=e1798] [cursor=pointer]:
        - generic [ref=e1799]:
          - generic [ref=e1800]: Is there a contract?
          - img [ref=e1802]
        - generic [ref=e1805]: No. Month-to-month. Cancel anytime.
